<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kentkart VTS - SA65 Takip Testi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .header h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2em;
        }
        
        .header p {
            color: #666;
            font-size: 1.1em;
        }
        
        .controls {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .btn-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        
        .btn-success {
            background: #10b981;
            color: white;
        }
        
        .btn-success:hover {
            background: #059669;
        }
        
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        
        .btn-danger:hover {
            background: #dc2626;
        }
        
        .stats {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }
        
        .vehicles-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .vehicles-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        
        .vehicle-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        
        .vehicle-card {
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            border-radius: 10px;
            padding: 20px;
            border-left: 5px solid #667eea;
            transition: all 0.3s;
        }
        
        .vehicle-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        
        .vehicle-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .vehicle-plate {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }
        
        .vehicle-status {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }
        
        .status-active {
            background: #10b981;
            color: white;
        }
        
        .status-inactive {
            background: #ef4444;
            color: white;
        }
        
        .vehicle-info {
            margin-top: 10px;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #d1d5db;
        }
        
        .info-label {
            color: #6b7280;
            font-weight: 600;
        }
        
        .info-value {
            color: #1f2937;
            font-weight: 500;
        }
        
        .coordinates {
            background: white;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            font-family: monospace;
            font-size: 0.9em;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2em;
        }
        
        .error {
            background: #fee2e2;
            color: #dc2626;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #dc2626;
        }
        
        .success {
            background: #d1fae5;
            color: #059669;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #059669;
        }
        
        .auto-refresh-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #10b981;
            margin-left: 10px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚌 Kentkart VTS - SA65 Hattı Takip</h1>
            <p>SA65 hattında çalışan araçların gerçek zamanlı pozisyonları</p>
        </div>

        <div class="controls">
            <div class="btn-group">
                <button class="btn btn-primary" onclick="fetchVehicles()">🔄 Verileri Yenile</button>
                <button class="btn btn-success" onclick="startAutoRefresh()">▶️ Otomatik Yenileme Başlat (5sn)</button>
                <button class="btn btn-danger" onclick="stopAutoRefresh()">⏸️ Otomatik Yenileme Durdur</button>
            </div>
        </div>

        <div class="stats">
            <h2>📊 İstatistikler <span id="autoRefreshIndicator"></span></h2>
            <div class="stat-grid">
                <div class="stat-card">
                    <div class="stat-label">Toplam Araç</div>
                    <div class="stat-value" id="totalVehicles">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">SA65 Araçları</div>
                    <div class="stat-value" id="sa65Count">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Son Güncelleme</div>
                    <div class="stat-value" id="lastUpdate" style="font-size: 1.2em;">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">API Durumu</div>
                    <div class="stat-value" id="apiStatus" style="font-size: 1.5em;">⏳</div>
                </div>
            </div>
        </div>

        <div class="vehicles-section">
            <h2>🚍 SA65 Araçları</h2>
            <div id="vehiclesContainer" class="loading">
                Veriler yükleniyor... Lütfen "Verileri Yenile" butonuna tıklayın.
            </div>
        </div>
    </div>

    <script>
        let autoRefreshInterval = null;

        async function fetchVehicles() {
            const container = document.getElementById('vehiclesContainer');
            const apiStatus = document.getElementById('apiStatus');
            
            try {
                container.innerHTML = '<div class="loading">🔄 Backend API üzerinden veriler çekiliyor...</div>';
                apiStatus.textContent = '🔄';

                // Backend proxy kullan (CORS bypass)
                const response = await fetch('/api/kentkart-vts');
                const data = await response.json();

                console.log('Backend API Response:', data);

                if (!data.success) {
                    throw new Error(data.error || 'API hatası');
                }

                // İstatistikleri güncelle
                document.getElementById('totalVehicles').textContent = data.total_vehicles || 0;
                document.getElementById('sa65Count').textContent = data.sa65_count || 0;
                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('tr-TR');
                apiStatus.textContent = '✅';

                // Araçları göster
                if (data.vehicles && data.vehicles.length > 0) {
                    displayVehicles(data.vehicles);
                    
                    if (data.note) {
                        container.innerHTML += `
                            <div class="success" style="margin-top: 20px;">
                                ℹ️ ${data.note}
                            </div>
                        `;
                    }
                } else {
                    container.innerHTML = `
                        <div class="error">
                            ⚠️ SA65 hattında araç bulunamadı.<br>
                            ${data.note || 'Veri yok'}
                        </div>
                    `;
                }

            } catch (error) {
                console.error('Fetch error:', error);
                container.innerHTML = `
                    <div class="error">
                        ❌ <strong>Hata:</strong> ${error.message}<br><br>
                        <strong>Gerçek veri için VTS Console kullanın:</strong><br>
                        1. <a href="https://vts.kentkart.com.tr" target="_blank">VTS'ye giriş yapın</a><br>
                        2. F12 → Console'a şu kodu yapıştırın:<br>
                        <pre style="background:white;padding:10px;border-radius:5px;overflow:auto;font-size:0.85em;">
fetch('https://vts.kentkart.com.tr/api/026/v1/latestdevicedata/get?fields=bus_id,car_no,display_route_code,lat,lon,speed,path_name,status,comp_name&sort=bus_id|asc&dc=' + Date.now())
  .then(r => r.json())
  .then(d => {
    const sa65 = d.data.data.filter(v => v.display_route_code?.includes('SA65'));
    console.table(sa65);
  });
                        </pre>
                    </div>
                `;
                apiStatus.textContent = '❌';
            }
        }

        function displayVehicles(vehicles) {
            const container = document.getElementById('vehiclesContainer');
            
            const html = `
                <div class="vehicle-grid">
                    ${vehicles.map(v => `
                        <div class="vehicle-card">
                            <div class="vehicle-header">
                                <div class="vehicle-plate">${v.car_no || 'Bilinmiyor'}</div>
                                <div class="vehicle-status ${v.status === 1 ? 'status-active' : 'status-inactive'}">
                                    ${v.status === 1 ? '🟢 Aktif' : '🔴 Pasif'}
                                </div>
                            </div>
                            <div class="vehicle-info">
                                <div class="info-row">
                                    <span class="info-label">🆔 Bus ID:</span>
                                    <span class="info-value">${v.bus_id || '-'}</span>
                                </div>
                                <div class="info-row">
                                    <span class="info-label">🚏 Hat Kodu:</span>
                                    <span class="info-value">${v.display_route_code || '-'}</span>
                                </div>
                                <div class="info-row">
                                    <span class="info-label">📍 Rota:</span>
                                    <span class="info-value">${v.path_name || '-'}</span>
                                </div>
                                <div class="info-row">
                                    <span class="info-label">🏢 Şirket:</span>
                                    <span class="info-value">${v.comp_name || '-'}</span>
                                </div>
                                <div class="info-row">
                                    <span class="info-label">🚗 Model:</span>
                                    <span class="info-value">${v.bus_model || '-'}</span>
                                </div>
                                <div class="info-row">
                                    <span class="info-label">⛽ Yakıt:</span>
                                    <span class="info-value">${v.fuel_type_description || v.fuel_type || '-'}</span>
                                </div>
                                <div class="info-row">
                                    <span class="info-label">⚡ Hız:</span>
                                    <span class="info-value">${v.speed || 0} km/s</span>
                                </div>
                                <div class="info-row">
                                    <span class="info-label">👨‍✈️ Sürücü:</span>
                                    <span class="info-value">${v.personel_name || ''} ${v.personel_last_name || '-'}</span>
                                </div>
                                <div class="info-row">
                                    <span class="info-label">🕐 Veri Zamanı:</span>
                                    <span class="info-value">${v.date_time ? new Date(v.date_time).toLocaleString('tr-TR') : '-'}</span>
                                </div>
                                ${v.lat && v.lon ? `
                                    <div class="coordinates">
                                        📍 Koordinatlar:<br>
                                        Enlem: ${v.lat}<br>
                                        Boylam: ${v.lon}<br>
                                        Yön: ${v.bearing || 0}°
                                    </div>
                                ` : '<div class="error">📍 Konum bilgisi yok</div>'}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            
            container.innerHTML = html;
        }

        function startAutoRefresh() {
            if (autoRefreshInterval) {
                stopAutoRefresh();
            }
            
            fetchVehicles();
            autoRefreshInterval = setInterval(fetchVehicles, 5000);
            
            document.getElementById('autoRefreshIndicator').innerHTML = 
                '<span class="auto-refresh-indicator"></span>';
        }

        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
                document.getElementById('autoRefreshIndicator').innerHTML = '';
            }
        }

        // Sayfa yüklendiğinde bir kez çek
        window.addEventListener('load', () => {
            setTimeout(fetchVehicles, 1000);
        });
    </script>
</body>
</html>
