<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>VL13 Hattı Otobüs Hareket Saati Listesi</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>📊 VL13 Hattı Otobüs Hareket Saati Listesi</h1>
      <div class="sub">Tablo: <strong>VL13</strong> — İlk 4 alan gösteriliyor</div>
    </div>
    <div class="controls">
      <button id="refreshBtn" class="btn">Yenile</button>
      <button id="approveBtn" class="btn">Onayla</button>
    </div>
  </header>

  <div id="mainCard" class="card">
    <div id="status" class="info">Veriler hazırlanıyor...</div>
    <div class="table-wrap" style="margin-top:12px;">
      <table id="dataTable" aria-describedby="status">
        <thead>
          <tr id="theadRow"><th>Yükleniyor...</th></tr>
        </thead>
        <tbody id="tbody">
          <tr><td class="small">Henüz veri yok.</td></tr>
        </tbody>
      </table>
    </div>
    <div id="meta" class="info" style="margin-top:12px"></div>
  </div>
</div>

<script>
const refreshBtn = document.getElementById('refreshBtn');
const approveBtn = document.getElementById('approveBtn');
const statusEl = document.getElementById('status');
const theadRow = document.getElementById('theadRow');
const tbody = document.getElementById('tbody');
const meta = document.getElementById('meta');

refreshBtn.addEventListener('click', fetchAndRender);
approveBtn.addEventListener('click', handleApproval);

async function fetchAndRender(){
  statusEl.textContent = 'Veriler yükleniyor...';
  theadRow.innerHTML = "<th>Yükleniyor...</th>";
  tbody.innerHTML = `<tr><td class="small">Yükleniyor...</td></tr>`;
  meta.textContent = '';

  try {
    const res = await fetch('/api/supabase');
    const data = await res.json();

    if(!data || data.length===0){
      statusEl.innerHTML = `<span class="small">Tablo boş veya erişim yok.</span>`;
      theadRow.innerHTML = "<th>Boş</th>";
      tbody.innerHTML = `<tr><td class="small">Kayıt yok.</td></tr>`;
      return;
    }

    const firstRow = data[0];
    const allKeys = Object.keys(firstRow);
    const showKeys = allKeys.slice(0,4);

    theadRow.innerHTML = '';
    showKeys.forEach(k=>{
      const th = document.createElement('th');
      th.textContent = k;
      theadRow.appendChild(th);
    });

    tbody.innerHTML = '';
    data.forEach(row=>{
      const tr = document.createElement('tr');
      showKeys.forEach(k=>{
        const td = document.createElement('td');
        td.textContent = row[k] ?? '';
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });

    statusEl.textContent = `Başarılı: ${data.length} kayıt alındı.`;
    meta.textContent = `Toplam sütun: ${allKeys.length} (ilk 4 gösteriliyor)`;

  } catch(err){
    console.error(err);
    statusEl.innerHTML = `<span class="error">Hata: ${err.message}</span>`;
  }
}

async function handleApproval(){
  try {
    statusEl.textContent = 'Onaylama işlemi başlatıldı...';
    const now = new Date();
    
    // Saat:Dakika:00 formatında şu anki zamanı al
    const currentHour = now.getHours().toString().padStart(2,'0');
    const currentMinute = now.getMinutes().toString().padStart(2,'0');
    const roundedTime = `${currentHour}:${currentMinute}:00`;

    // Tabloyu çek
    const res = await fetch('/api/supabase');
    const data = await res.json();
    if(!data || data.length===0){
      statusEl.innerHTML = `<span class="error">Tablo boş.</span>`;
      return;
    }

    // Şu anki zamanı dakika cinsinden hesapla
    const nowMinutes = now.getHours() * 60 + now.getMinutes();
    
    let closest = null;
    let closestDiff = Infinity;

    // Tarife_Saati'ne göre 10 dakika aralığında en yakın satırı bul
    for(const row of data){
      const [h, m] = row.Tarife_Saati.split(':').map(Number);
      const rowMinutes = h * 60 + m;
      const diff = Math.abs(rowMinutes - nowMinutes);
      
      // ±10 dakika aralığında ve en yakın olanı seç
      if(diff <= 10 && diff < closestDiff){
        closest = row;
        closestDiff = diff;
      }
    }

    if(!closest){
      statusEl.innerHTML = `<span class="error">±10 dk içinde kayıt bulunamadı.</span>`;
      return;
    }

    // En yakın satırdaki Tarife ve Tarife_Saati değerlerini al
    const tarife = closest.Tarife;           // T1, T2, T3... vb
    let tarifeTime = closest.Tarife_Saati;   // HH:MM:SS
    
    // Time formatını standardize et
    if(tarifeTime && !tarifeTime.includes(':')) {
      console.warn('Tarife_Saati format hatası:', tarifeTime);
    }
    
    // Tarife_Saati'nden saat ve dakika çıkar
    const tarifeTimeParts = String(tarifeTime).split(':');
    const th = parseInt(tarifeTimeParts[0]);
    const tm = parseInt(tarifeTimeParts[1]);
    
    // Şu anki zamanından saat ve dakika çıkar
    const roundedTimeParts = roundedTime.split(':');
    const ch = parseInt(roundedTimeParts[0]);
    const cm = parseInt(roundedTimeParts[1]);
    
    // Dakika cinsinden fark hesapla (negative = erken, positive = geç)
    const tarife_minutes = th * 60 + tm;
    const current_minutes = ch * 60 + cm;
    const diffMinutes = current_minutes - tarife_minutes;

    console.log('Debug:', {
      tarife,
      tarifeTime,
      roundedTime,
      th, tm, ch, cm,
      tarife_minutes,
      current_minutes,
      diffMinutes
    });

    // Durum belirle
    let durum = "Zamanında";
    if(diffMinutes < 0) durum = "Erken Çıkış";      // Saat daha küçük = önce
    else if(diffMinutes > 0) durum = "Geç Çıkış";   // Saat daha büyük = sonra
    // diffMinutes === 0 ise "Zamanında" kalır

    // POST ile kaydet - Time tipini ISO 8601 formatında gönder
    const postRes = await fetch('/api/supabase',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ 
        Tarife: tarife,
        Tarife_Saati: `${String(th).padStart(2,'0')}:${String(tm).padStart(2,'0')}:00`,
        Onaylanan: roundedTime,
        Durum: durum 
      })
    });
    const result = await postRes.json();
    if(result.error) throw new Error(result.error);

    statusEl.textContent = `✅ Onaylandı (${tarifeTime}) → ${roundedTime} (${durum})`;
    
    // 2 saniye sonra listeyi yenile
    setTimeout(() => fetchAndRender(), 2000);

  } catch(err){
    console.error(err);
    statusEl.innerHTML = `<span class="error">Hata: ${err.message}</span>`;
  }
}

// İlk yükleme
fetchAndRender();
</script>
</body>
</html>
