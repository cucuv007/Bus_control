<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>VL13 Hattı Otobüs Hareket Saati Listesi</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>📊 VL13 Hattı Otobüs Hareket Saati Listesi</h1>
      <div class="sub">Tablo: <strong>VL13</strong> — İlk 4 alan gösteriliyor</div>
    </div>
    <div class="controls">
      <button id="refreshBtn" class="btn">Yenile</button>
      <button id="approveBtn" class="btn">Onayla</button>
    </div>
  </header>

  <div id="mainCard" class="card">
    <div id="status" class="info">Veriler hazırlanıyor...</div>
    <div class="table-wrap" style="margin-top:12px;">
      <table id="dataTable" aria-describedby="status">
        <thead>
          <tr id="theadRow"><th>Yükleniyor...</th></tr>
        </thead>
        <tbody id="tbody">
          <tr><td class="small">Henüz veri yok.</td></tr>
        </tbody>
      </table>
    </div>
    <div id="meta" class="info" style="margin-top:12px"></div>
  </div>
</div>

<script>
const refreshBtn = document.getElementById('refreshBtn');
const approveBtn = document.getElementById('approveBtn');
const statusEl = document.getElementById('status');
const theadRow = document.getElementById('theadRow');
const tbody = document.getElementById('tbody');
const meta = document.getElementById('meta');

let isLoading = false;

refreshBtn.addEventListener('click', fetchAndRender);
approveBtn.addEventListener('click', handleApproval);

async function fetchAndRender() {
  if (isLoading) return;
  
  isLoading = true;
  statusEl.textContent = 'Veriler yükleniyor...';
  theadRow.innerHTML = "<th>Yükleniyor...</th>";
  tbody.innerHTML = `<tr><td class="small">Yükleniyor...</td></tr>`;
  meta.textContent = '';
  refreshBtn.disabled = true;

  try {
    const res = await fetch('/api/supabase');
    
    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }
    
    const data = await res.json();

    if (!data || data.length === 0) {
      statusEl.innerHTML = `<span class="small">Tablo boş veya erişim yok.</span>`;
      theadRow.innerHTML = "<th>Boş</th>";
      tbody.innerHTML = `<tr><td class="small">Kayıt yok.</td></tr>`;
      return;
    }

    const firstRow = data[0];
    const allKeys = Object.keys(firstRow);
    const showKeys = allKeys;
    

    theadRow.innerHTML = '';
    showKeys.forEach(k => {
      const th = document.createElement('th');
      th.textContent = k;
      theadRow.appendChild(th);
    });

    tbody.innerHTML = '';
    data.forEach(row => {
      const tr = document.createElement('tr');
      showKeys.forEach(k => {
        const td = document.createElement('td');
        const value = row[k];
        td.textContent = value !== null && value !== undefined ? value : '';
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });

    statusEl.textContent = `Başarılı: ${data.length} kayıt alındı.`;
    meta.textContent = `Toplam sütun: ${allKeys.length} (ilk 4 gösteriliyor)`;

  } catch (err) {
    console.error('Fetch error:', err);
    statusEl.innerHTML = `<span class="error">Hata: ${err.message}</span>`;
  } finally {
    isLoading = false;
    refreshBtn.disabled = false;
  }
}

async function handleApproval() {
  if (isLoading) return;
  
  isLoading = true;
  const originalText = statusEl.textContent;
  statusEl.textContent = 'Onaylama işlemi başlatılıyor...';
  approveBtn.disabled = true;
  refreshBtn.disabled = true;

  try {
    const res = await fetch('/api/supabase', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' }
    });

    const result = await res.json();

    if (!res.ok || result.error) {
      throw new Error(result.error || 'Onaylama başarısız');
    }

    // Show success message
    statusEl.innerHTML = `<span style="color: #27ae60;">✅ ${result.message}</span>`;
    
    // Refresh table after 1.5 seconds
    setTimeout(() => {
      fetchAndRender();
    }, 1500);

  } catch (err) {
    console.error('Approval error:', err);
    statusEl.innerHTML = `<span class="error">❌ Hata: ${err.message}</span>`;
    
    // Restore status after 3 seconds
    setTimeout(() => {
      statusEl.textContent = originalText;
    }, 3000);
  } finally {
    isLoading = false;
    approveBtn.disabled = false;
    refreshBtn.disabled = false;
  }
}

// Initial load
fetchAndRender();
</script>
</body>
</html>
