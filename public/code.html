<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Otobüs Hareket Saati Listesi</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>📊 Otobüs Hareket Saati Yönetimi</h1>
      <div class="sub">
        Tablo: <strong id="currentTable">Seçilmedi</strong>
      </div>
    </div>
    <div class="controls">
      <select id="tableSelect" class="select">
        <option value="">Tablo Seçin</option>
      </select>
      <button id="uploadBtn" class="btn btn-primary">Yükle</button>
      <button id="refreshBtn" class="btn">Yenile</button>
      <button id="approveBtn" class="btn" disabled>Onayla</button>
    </div>
  </header>

  <div id="mainCard" class="card">
    <div id="status" class="info">Lütfen bir tablo seçin veya Google Drive'dan yükleyin.</div>
    <div class="table-wrap" style="margin-top:12px;">
      <table id="dataTable" aria-describedby="status">
        <thead>
          <tr id="theadRow"><th>Tablo Seçilmedi</th></tr>
        </thead>
        <tbody id="tbody">
          <tr><td class="small">Henüz veri yok.</td></tr>
        </tbody>
      </table>
    </div>
    <div id="meta" class="info" style="margin-top:12px"></div>
  </div>
</div>

<script>
const uploadBtn = document.getElementById('uploadBtn');
const refreshBtn = document.getElementById('refreshBtn');
const approveBtn = document.getElementById('approveBtn');
const tableSelect = document.getElementById('tableSelect');
const statusEl = document.getElementById('status');
const currentTableEl = document.getElementById('currentTable');
const theadRow = document.getElementById('theadRow');
const tbody = document.getElementById('tbody');
const meta = document.getElementById('meta');

let isLoading = false;
let selectedTable = null;

// Event Listeners
uploadBtn.addEventListener('click', handleUpload);
refreshBtn.addEventListener('click', loadTables);
approveBtn.addEventListener('click', handleApproval);
tableSelect.addEventListener('change', handleTableChange);

// Load tables on page load
loadTables();

async function loadTables() {
  if (isLoading) return;
  
  isLoading = true;
  statusEl.textContent = 'Tablolar yükleniyor...';
  refreshBtn.disabled = true;

  try {
    const res = await fetch('/api/list-tables');
    
    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }
    
    const data = await res.json();
    const tables = data.tables || [];

    // Update select dropdown
    tableSelect.innerHTML = '<option value="">Tablo Seçin</option>';
    tables.forEach(table => {
      const option = document.createElement('option');
      option.value = table;
      option.textContent = table;
      tableSelect.appendChild(option);
    });

    statusEl.textContent = `${tables.length} tablo bulundu. Lütfen bir tablo seçin.`;

    // If a table was previously selected, reload it
    if (selectedTable && tables.includes(selectedTable)) {
      tableSelect.value = selectedTable;
      await loadTableData(selectedTable);
    }

  } catch (err) {
    console.error('Load tables error:', err);
    statusEl.innerHTML = `<span class="error">Hata: ${err.message}</span>`;
  } finally {
    isLoading = false;
    refreshBtn.disabled = false;
  }
}

async function handleTableChange(e) {
  const tableName = e.target.value;
  
  if (!tableName) {
    selectedTable = null;
    currentTableEl.textContent = 'Seçilmedi';
    approveBtn.disabled = true;
    theadRow.innerHTML = '<th>Tablo Seçilmedi</th>';
    tbody.innerHTML = '<tr><td class="small">Henüz veri yok.</td></tr>';
    meta.textContent = '';
    statusEl.textContent = 'Lütfen bir tablo seçin.';
    return;
  }

  selectedTable = tableName;
  currentTableEl.textContent = tableName;
  await loadTableData(tableName);
}

async function loadTableData(tableName) {
  if (isLoading) return;
  
  isLoading = true;
  statusEl.textContent = `${tableName} veriler yükleniyor...`;
  theadRow.innerHTML = "<th>Yükleniyor...</th>";
  tbody.innerHTML = `<tr><td class="small">Yükleniyor...</td></tr>`;
  meta.textContent = '';
  approveBtn.disabled = true;

  try {
    const res = await fetch(`/api/table-data?tableName=${encodeURIComponent(tableName)}`);
    
    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }
    
    const data = await res.json();

    if (!data || data.length === 0) {
      statusEl.innerHTML = `<span class="small">Tablo boş.</span>`;
      theadRow.innerHTML = "<th>Boş</th>";
      tbody.innerHTML = `<tr><td class="small">Kayıt yok.</td></tr>`;
      return;
    }

    const firstRow = data[0];
    const allKeys = Object.keys(firstRow);
    const showKeys = allKeys;

    theadRow.innerHTML = '';
    showKeys.forEach(k => {
      const th = document.createElement('th');
      th.textContent = k;
      theadRow.appendChild(th);
    });

    tbody.innerHTML = '';
    data.forEach(row => {
      const tr = document.createElement('tr');
      showKeys.forEach(k => {
        const td = document.createElement('td');
        const value = row[k];
        td.textContent = value !== null && value !== undefined ? value : '';
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });

    statusEl.textContent = `Başarılı: ${data.length} kayıt alındı.`;
    meta.textContent = `Toplam sütun: ${allKeys.length} (tümü gösteriliyor)`;
    approveBtn.disabled = false;

  } catch (err) {
    console.error('Fetch error:', err);
    statusEl.innerHTML = `<span class="error">Hata: ${err.message}</span>`;
  } finally {
    isLoading = false;
  }
}

async function handleUpload() {
  if (isLoading) return;
  
  if (!confirm('Google Drive\'daki tüm Excel dosyaları yüklenecek ve mevcut veriler silinecek. Devam etmek istiyor musunuz?')) {
    return;
  }

  isLoading = true;
  const originalText = statusEl.textContent;
  statusEl.textContent = 'Google Drive dosyaları yükleniyor... Bu işlem birkaç dakika sürebilir.';
  uploadBtn.disabled = true;
  refreshBtn.disabled = true;
  approveBtn.disabled = true;

  try {
    const res = await fetch('/api/upload-from-drive', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' }
    });

    const result = await res.json();

    if (!res.ok || result.error) {
      throw new Error(result.error || 'Yükleme başarısız');
    }

    // Show success message
    const successCount = result.results.filter(r => r.status === 'success').length;
    const errorCount = result.results.filter(r => r.status === 'error').length;
    
    statusEl.innerHTML = `<span style="color: #27ae60;">✅ Yükleme tamamlandı! ${successCount} dosya başarılı, ${errorCount} hata</span>`;
    
    // Show detailed results
    console.log('Upload results:', result.results);
    
    // Reload tables after 2 seconds
    setTimeout(() => {
      loadTables();
    }, 2000);

  } catch (err) {
    console.error('Upload error:', err);
    statusEl.innerHTML = `<span class="error">❌ Hata: ${err.message}</span>`;
    
    setTimeout(() => {
      statusEl.textContent = originalText;
    }, 5000);
  } finally {
    isLoading = false;
    uploadBtn.disabled = false;
    refreshBtn.disabled = false;
  }
}

async function handleApproval() {
  if (isLoading || !selectedTable) return;
  
  isLoading = true;
  const originalText = statusEl.textContent;
  statusEl.textContent = 'Onaylama işlemi başlatılıyor...';
  approveBtn.disabled = true;
  refreshBtn.disabled = true;

  try {
    const res = await fetch(`/api/table-data?tableName=${encodeURIComponent(selectedTable)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' }
    });

    const result = await res.json();

    if (!res.ok || result.error) {
      throw new Error(result.error || 'Onaylama başarısız');
    }

    // Show success message
    statusEl.innerHTML = `<span style="color: #27ae60;">✅ ${result.message}</span>`;
    
    // Refresh table after 1.5 seconds
    setTimeout(() => {
      loadTableData(selectedTable);
    }, 1500);

  } catch (err) {
    console.error('Approval error:', err);
    statusEl.innerHTML = `<span class="error">❌ Hata: ${err.message}</span>`;
    
    setTimeout(() => {
      statusEl.textContent = originalText;
    }, 3000);
  } finally {
    isLoading = false;
    approveBtn.disabled = false;
    refreshBtn.disabled = false;
  }
}
</script>
</body>
</html>
